<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorem Ipsum Activity</title>
    <!-- Tailwind CSS for utility classes and responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Import Inter font for a clean, modern look */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        /* BRAND PALETTE MAPPING:
           #1f2a52 (Dark Blue)   -> Large Circle Background / Text Emphasis
           #00bec7 (Teal)        -> Active State / Highlight
           #d2f0f0 (Light Cyan)  -> Page Background
           #abb5bf (Grey)        -> Inactive Small Circles
        */

        body {
            font-family: 'Inter', sans-serif;
            background-color: #d2f0f0; /* Brand Light Cyan */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
            margin: 0;
            overflow: hidden;
        }

        /* Main container for the entire activity */
        .learning-activity-container {
            position: relative;
            width: 650px;
            height: 650px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Styling for the large central circle */
        .large-circle {
            width: 300px;
            height: 300px;
            background-color: #1f2a52; /* Brand Dark Blue */
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(31, 42, 82, 0.3); /* Colored shadow based on brand */
            transition: all 0.5s ease-in-out;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d2f0f0; /* Light text for contrast against dark circle */
            line-height: 1.6;
            box-sizing: border-box;
        }

        .large-circle-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .large-circle-content p {
            font-size: 1rem;
            font-weight: 400;
            word-wrap: break-word;
            overflow-wrap: break-word;
            margin: 0;
        }

        /* Wrapper for small circles */
        #small-circles-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        /* Styling for individual small circles */
        .small-circle {
            position: absolute;
            width: 80px;
            height: 80px;
            background-color: #abb5bf; /* Brand Grey (Inactive state) */
            color: #1f2a52; /* Dark text on grey background */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            transition: transform 0.7s ease-in-out,
                        width 0.3s ease-in-out, height 0.3s ease-in-out,
                        border 0.3s ease-in-out, color 0.3s ease-in-out,
                        background-color 0.3s ease-in-out;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 5px;
            box-sizing: border-box;
            line-height: 1.2;
        }

        /* Styling for the active (clicked) small circle */
        .small-circle.active {
            width: 100px;
            height: 100px;
            background-color: #00bec7; /* Brand Teal (Active state) */
            border: 4px solid #1f2a52; /* Brand Dark Blue Border */
            color: #ffffff; /* White text for pop on teal */
            z-index: 10;
            box-shadow: 0 8px 16px rgba(0, 190, 199, 0.4); /* Teal glow */
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .learning-activity-container {
                width: 90vw;
                height: 90vw;
            }

            .large-circle {
                width: 50vw;
                height: 50vw;
                padding: 15px;
            }

            .large-circle-content p {
                font-size: 0.8rem;
            }

            .small-circle {
                width: 15vw;
                height: 15vw;
                font-size: 0.65rem;
                padding: 3px;
            }

            .small-circle.active {
                width: 18vw;
                height: 18vw;
            }
        }
    </style>
</head>
<body>
    <div class="learning-activity-container">
        <!-- Large central circle for displaying content -->
        <div id="large-circle" class="large-circle">
            <div class="large-circle-content">
                <p id="large-circle-text">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sequi dolorem ipsum.</p>
            </div>
        </div>
        <!-- Wrapper for small circles -->
        <div id="small-circles-wrapper"></div>
    </div>

    <script>
        // Data updated with Lorem Ipsum content
        const sectionsData = [
            { id: 'lorem', title: 'Lorem', content: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.' },
            { id: 'ipsum', title: 'Ipsum', content: 'Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.' },
            { id: 'dolor', title: 'Dolor', content: 'Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.' },
            { id: 'sit', title: 'Sit', content: 'Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.' },
            { id: 'amet', title: 'Amet', content: 'Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam.' },
            { id: 'consectetur', title: 'Consectetur', content: 'Eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo.' },
            { id: 'adipiscing', title: 'Adipiscing', content: 'Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit, sed quia consequuntur magni dolores eos.' }
        ];

        // Get references to key DOM elements
        const largeCircleText = document.getElementById('large-circle-text');
        const smallCirclesWrapper = document.getElementById('small-circles-wrapper');
        const learningActivityContainer = document.querySelector('.learning-activity-container');

        // State variables
        let activeCircleId = null; 
        let lastClickedSectionIndex = -1; 

        // Base sizes for calculations (desktop reference)
        const BASE_CONTAINER_WIDTH = 650;
        const LARGE_CIRCLE_DIAMETER_PX = 300;
        const SMALL_CIRCLE_DIAMETER_PX = 80;
        const ACTIVE_SMALL_CIRCLE_DIAMETER_PX = 100;
        const PADDING_FROM_LARGE_CIRCLE = 40; 

        // Angle steps
        const LEFT_SLOT_ANGLE_STEP_DEGREES = 25; 
        const RIGHT_SLOT_ANGLE_STEP_DEGREES = 25; 

        /**
         * Calculates dynamic sizes based on the current width of the main container.
         */
        function getDynamicSizes() {
            const containerWidth = learningActivityContainer.offsetWidth;
            
            const largeCircleRatio = LARGE_CIRCLE_DIAMETER_PX / BASE_CONTAINER_WIDTH;
            const smallCircleRatio = SMALL_CIRCLE_DIAMETER_PX / BASE_CONTAINER_WIDTH;
            const activeSmallCircleRatio = ACTIVE_SMALL_CIRCLE_DIAMETER_PX / BASE_CONTAINER_WIDTH;
            const paddingRatio = PADDING_FROM_LARGE_CIRCLE / BASE_CONTAINER_WIDTH;

            return {
                largeCircleDiameter: containerWidth * largeCircleRatio,
                smallCircleDiameter: containerWidth * smallCircleRatio,
                activeSmallCircleDiameter: containerWidth * activeSmallCircleRatio,
                padding: containerWidth * paddingRatio
            };
        }

        /**
         * Calculates the radius of the orbit for the small circles.
         */
        function getOrbitRadius() {
            const sizes = getDynamicSizes();
            return (sizes.largeCircleDiameter / 2) + (sizes.smallCircleDiameter / 2) + sizes.padding;
        }

        /**
         * Converts degrees to radians.
         */
        function degToRad(degrees) {
            return degrees * (Math.PI / 180);
        }

        /**
         * Renders and updates the positions and states of all small circles.
         */
        function renderCircles() {
            const orbitRadius = getOrbitRadius();
            const sizes = getDynamicSizes();
            
            const containerCenterX = learningActivityContainer.offsetWidth / 2;
            const containerCenterY = learningActivityContainer.offsetHeight / 2;

            const rightArcTopAngleDegrees = 60; 
            const leftArcTopAngleDegrees = 120; 

            const activeSectionIndex = sectionsData.findIndex(s => s.id === activeCircleId);

            sectionsData.forEach((section, index) => {
                const circleElement = document.getElementById(`circle-${section.id}`);
                if (!circleElement) return;

                let targetAngleDegrees;
                let currentCircleDiameter = sizes.smallCircleDiameter;

                if (section.id === activeCircleId) {
                    currentCircleDiameter = sizes.activeSmallCircleDiameter;
                    circleElement.classList.add('active');
                } else {
                    circleElement.classList.remove('active');
                }

                if (index <= activeSectionIndex) {
                    // Left side
                    targetAngleDegrees = leftArcTopAngleDegrees + (index * LEFT_SLOT_ANGLE_STEP_DEGREES);
                } else {
                    // Right side
                    const relativeIndexOnRight = index - (activeSectionIndex + 1);
                    targetAngleDegrees = rightArcTopAngleDegrees - (relativeIndexOnRight * RIGHT_SLOT_ANGLE_STEP_DEGREES);
                }

                const targetAngleRadians = degToRad(targetAngleDegrees);

                const x = containerCenterX + orbitRadius * Math.cos(targetAngleRadians) - (currentCircleDiameter / 2);
                const y = containerCenterY - orbitRadius * Math.sin(targetAngleRadians) - (currentCircleDiameter / 2);
                
                circleElement.style.transform = `translate(${x}px, ${y}px)`;
                circleElement.style.width = `${currentCircleDiameter}px`;
                circleElement.style.height = `${currentCircleDiameter}px`;
            });
        }

        /**
         * Handles the click event.
         */
        function handleCircleClick(event) {
            const clickedCircle = event.currentTarget;
            const clickedId = clickedCircle.dataset.id;

            if (activeCircleId === clickedId) {
                return;
            }

            lastClickedSectionIndex = sectionsData.findIndex(s => s.id === clickedId);
            activeCircleId = clickedId;

            const selectedSection = sectionsData.find(s => s.id === clickedId);
            if (selectedSection) {
                largeCircleText.textContent = selectedSection.content;
            }

            renderCircles();
        }

        /**
         * Initializes the activity.
         */
        function init() {
            sectionsData.forEach(section => {
                const circleDiv = document.createElement('div');
                circleDiv.classList.add('small-circle');
                circleDiv.id = `circle-${section.id}`; 
                circleDiv.dataset.id = section.id; 
                circleDiv.textContent = section.title; 
                
                circleDiv.addEventListener('click', handleCircleClick); 
                smallCirclesWrapper.appendChild(circleDiv); 
            });

            renderCircles();

            window.addEventListener('resize', renderCircles);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
